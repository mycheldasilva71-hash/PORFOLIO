      <stop offset="0%" stop-color="#a9f26b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a9f26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameLand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2b1f"/>
      <stop offset="100%" stop-color="#101d16"/>
    </linearGradient>
    <linearGradient id="mountainFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff8f"/>
      <stop offset="100%" stop-color="#7fbf4d"/>
